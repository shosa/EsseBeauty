worker_processes auto;
events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS — lets nginx start even if a backend isn't up yet
  # and re-resolve if a container restarts with a new address.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 3001;

    location = /health {
      access_log off;
      return 204;
    }

    # Everything owned by the communications service: WhatsApp/email/reminder
    # settings, review lifecycle (public submit/resolve included), and the
    # inbound WhatsApp webhook. Kept as one gateway so no frontend needed to
    # change its NEXT_PUBLIC_API_URL when this service was split out.
    location ~ ^/api/salons/[^/]+/(communications|reminders|reviews|review-invitations)(/|$) {
      set $communications_upstream http://communications:3003;
      proxy_pass $communications_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/public/reviews/ {
      set $communications_upstream http://communications:3003;
      proxy_pass $communications_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/webhooks/whatsapp/ {
      set $communications_upstream http://communications:3003;
      proxy_pass $communications_upstream;
      client_max_body_size 5m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything owned by the loyalty/marketing service: points, tiers,
    # rewards, redemptions, and email/WhatsApp campaigns.
    location ~ ^/api/salons/[^/]+/(loyalty|campaigns|campaign-templates)(/|$) {
      set $loyalty_marketing_upstream http://loyalty-marketing:3006;
      proxy_pass $loyalty_marketing_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/public/[^/]+/loyalty(/|$) {
      set $loyalty_marketing_upstream http://loyalty-marketing:3006;
      proxy_pass $loyalty_marketing_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sale checkout is the one path under /appointments/ that belongs to the
    # commerce service, not booking (it's what actually completes an
    # appointment — see routes/sales/index.ts) — matched before the general
    # booking location below so it isn't shadowed by it.
    location ~ ^/api/salons/[^/]+/appointments/[^/]+/checkout(/|$) {
      set $commerce_upstream http://commerce:3008;
      proxy_pass $commerce_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything owned by the booking service: appointments, slots,
    # calendar events, and the waitlist.
    location ~ ^/api/salons/[^/]+/(appointments|slots|calendar-events|waitlist-summary|waitlist)(/|$) {
      set $booking_upstream http://booking:3007;
      proxy_pass $booking_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/public/[^/]+/waitlist(/|$) {
      set $booking_upstream http://booking:3007;
      proxy_pass $booking_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything owned by the commerce service: inventory, POS
    # catalog/checkout/customers, sales, purchase vouchers, and accounting
    # exports.
    location ~ ^/api/salons/[^/]+/(inventory|pos-catalog|pos-checkout|pos-customers|sales|vouchers|accounting)(/|$) {
      set $commerce_upstream http://commerce:3008;
      proxy_pass $commerce_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything owned by the identity service: staff/owner login, session
    # lifecycle, password recovery, and user/permission management. Customer
    # auth (/api/public/:slug/customer-auth/...) stays on the core API — it's
    # a different identity surface tied to the public booking domain.
    location ~ ^/api/auth/ {
      set $identity_upstream http://identity:3009;
      proxy_pass $identity_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else stays on the core API.
    location / {
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
