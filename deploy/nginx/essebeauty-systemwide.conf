map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream esse_web {
  server 127.0.0.1:3000;
}

upstream esse_pwa {
  server 127.0.0.1:3002;
}

upstream esse_staff_pwa {
  server 127.0.0.1:3003;
}

upstream esse_admin {
  server 127.0.0.1:3004;
}

upstream esse_website {
  server 127.0.0.1:3005;
}

upstream esse_api {
  server 127.0.0.1:3011;
}

upstream esse_communications {
  server 127.0.0.1:3013;
}

upstream esse_loyalty_marketing {
  server 127.0.0.1:3016;
}

upstream esse_booking {
  server 127.0.0.1:3017;
}

upstream esse_commerce {
  server 127.0.0.1:3018;
}

upstream esse_identity {
  server 127.0.0.1:3019;
}

server {
  server_name essebeauty.shosa.me;

  location / {
    proxy_pass http://esse_web;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/essebeauty.shosa.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/essebeauty.shosa.me/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name api.essebeauty.shosa.me;

  location = /health {
    access_log off;
    return 204;
  }

  location ~ ^/api/salons/[^/]+/(communications|reminders|reviews|review-invitations)(/|$) {
    proxy_pass http://esse_communications;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/public/reviews/ {
    proxy_pass http://esse_communications;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/webhooks/whatsapp/ {
    proxy_pass http://esse_communications;
    client_max_body_size 5m;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/salons/[^/]+/(loyalty|campaigns|campaign-templates)(/|$) {
    proxy_pass http://esse_loyalty_marketing;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/public/[^/]+/loyalty(/|$) {
    proxy_pass http://esse_loyalty_marketing;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/salons/[^/]+/appointments/[^/]+/checkout(/|$) {
    proxy_pass http://esse_commerce;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/salons/[^/]+/(appointments|slots|calendar-events|waitlist-summary|waitlist)(/|$) {
    proxy_pass http://esse_booking;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/public/[^/]+/waitlist(/|$) {
    proxy_pass http://esse_booking;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/salons/[^/]+/(inventory|pos-catalog|pos-checkout|pos-customers|sales|vouchers|accounting)(/|$) {
    proxy_pass http://esse_commerce;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location ~ ^/api/auth/ {
    proxy_pass http://esse_identity;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  location / {
    proxy_pass http://esse_api;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/essebeauty.shosa.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/essebeauty.shosa.me/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name app.essebeauty.shosa.me;

  location / {
    proxy_pass http://esse_pwa;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/essebeauty.shosa.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/essebeauty.shosa.me/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name staff.essebeauty.shosa.me;

  location / {
    proxy_pass http://esse_staff_pwa;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/essebeauty.shosa.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/essebeauty.shosa.me/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name admin.essebeauty.shosa.me;

  location / {
    proxy_pass http://esse_admin;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/essebeauty.shosa.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/essebeauty.shosa.me/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name shosa.me;

  location / {
    proxy_pass http://esse_website;
    include /etc/nginx/snippets/essebeauty-proxy.conf;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/shosa.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shosa.me/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  server_name essebeauty.shosa.me api.essebeauty.shosa.me app.essebeauty.shosa.me staff.essebeauty.shosa.me admin.essebeauty.shosa.me shosa.me;
  return 301 https://$host$request_uri;
}
