name: esse-beauty

services:
  db:
    image: postgres:16-alpine
    container_name: esse-beauty-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esse_beauty}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-esse_beauty}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      app:
        aliases:
          - db

  redis:
    image: redis:7-alpine
    container_name: esse-beauty-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app

  migrate:
    container_name: esse-beauty-migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
      POSTGRES_MAINTENANCE_DB: ${POSTGRES_MAINTENANCE_DB:-postgres}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  api:
    container_name: esse-beauty-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      API_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
      PLATFORM_API_HEALTH_URL: ${PLATFORM_API_HEALTH_URL:-http://127.0.0.1:3001/health}
      PLATFORM_COMMUNICATIONS_HEALTH_URL: ${PLATFORM_COMMUNICATIONS_HEALTH_URL:-http://communications:3003/health}
      PLATFORM_LOYALTY_MARKETING_HEALTH_URL: ${PLATFORM_LOYALTY_MARKETING_HEALTH_URL:-http://loyalty-marketing:3006/health}
      PLATFORM_BOOKING_HEALTH_URL: ${PLATFORM_BOOKING_HEALTH_URL:-http://booking:3007/health}
      PLATFORM_COMMERCE_HEALTH_URL: ${PLATFORM_COMMERCE_HEALTH_URL:-http://commerce:3008/health}
      PLATFORM_IDENTITY_HEALTH_URL: ${PLATFORM_IDENTITY_HEALTH_URL:-http://identity:3009/health}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${API_UPSTREAM_PORT:-3011}:3001"
    networks:
      - app

  communications:
    container_name: esse-beauty-communications
    build:
      context: .
      dockerfile: apps/communications/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3003
      API_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
      REDIS_URL: redis://redis:6379
      REVIEW_TOKEN_SECRET: ${REVIEW_TOKEN_SECRET:?REVIEW_TOKEN_SECRET is required}
      META_APP_SECRET: ${META_APP_SECRET:-}
      PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
      PROVIDER_CREDENTIAL_KEY_VERSION: ${PROVIDER_CREDENTIAL_KEY_VERSION:-v1}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      PWA_URL: ${PWA_URL:-http://localhost:3002}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:support@essebeauty.app}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${COMMUNICATIONS_UPSTREAM_PORT:-3013}:3003"
    networks:
      - app

  loyalty-marketing:
    container_name: esse-beauty-loyalty-marketing
    build:
      context: .
      dockerfile: apps/loyalty-marketing/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3006
      API_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${LOYALTY_MARKETING_UPSTREAM_PORT:-3016}:3006"
    networks:
      - app

  booking:
    container_name: esse-beauty-booking
    build:
      context: .
      dockerfile: apps/booking/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3007
      API_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
      REDIS_URL: redis://redis:6379
      PWA_URL: ${PWA_URL:-http://localhost:3002}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3007/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${BOOKING_UPSTREAM_PORT:-3017}:3007"
    networks:
      - app

  commerce:
    container_name: esse-beauty-commerce
    build:
      context: .
      dockerfile: apps/commerce/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3008
      API_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3008/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${COMMERCE_UPSTREAM_PORT:-3018}:3008"
    networks:
      - app

  identity:
    container_name: esse-beauty-identity
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3009
      API_HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esse_beauty}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3009/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${IDENTITY_UPSTREAM_PORT:-3019}:3009"
    networks:
      - app

  gateway:
    container_name: esse-beauty-gateway
    image: nginx:1.27-alpine
    profiles:
      - gateway
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
      communications:
        condition: service_healthy
      loyalty-marketing:
        condition: service_healthy
      booking:
        condition: service_healthy
      commerce:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - app

  web:
    container_name: esse-beauty-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_PWA_URL: ${NEXT_PUBLIC_PWA_URL:-http://localhost:3002}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - app

  pwa:
    container_name: esse-beauty-pwa
    build:
      context: .
      dockerfile: apps/pwa/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: ${PWA_API_INTERNAL_URL:-http://gateway:3001}
      REVIEW_SESSION_SECRET: ${REVIEW_SESSION_SECRET:?REVIEW_SESSION_SECRET is required}
    ports:
      - "127.0.0.1:${PWA_PORT:-3002}:3002"
    networks:
      - app

  staff-pwa:
    container_name: esse-beauty-staff-pwa
    build:
      context: .
      dockerfile: apps/staff-pwa/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${STAFF_PWA_PORT:-3003}:3003"
    networks:
      - app

  admin:
    container_name: esse-beauty-admin
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PLATFORM_PORT:-3004}:3004"
    networks:
      - app
  website:
    container_name: esse-beauty-website
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://shosa.me}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-https://essebeauty.shosa.me}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.essebeauty.shosa.me}
        NEXT_PUBLIC_PLATFORM_URL: ${NEXT_PUBLIC_PLATFORM_URL:-https://admin.essebeauty.shosa.me}
        NEXT_PUBLIC_PWA_URL: ${NEXT_PUBLIC_PWA_URL:-https://app.essebeauty.shosa.me}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-3005}:3005"
    networks:
      - app
networks:
  app:
    name: esse-beauty-network

volumes:
  postgres_data:
    name: esse-beauty-postgres-data
  redis_data:
    name: esse-beauty-redis-data
